<!DOCTYPE html>
<html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      
      <title>Hustle.os</title>
      
      <link rel="stylesheet" href="style.css" />
    
    </head>
    
    <body class="intro-body">
      
      <main class="pre-home">
        
        <a href="home.html" class="pre-home-logo" id="preHomeLogo">
          Hustle.os
        </a>
      
      </main>
      
      <script>

      const logo = document.getElementById("preHomeLogo");
      logo.addEventListener("click", function(event) {
        
        event.preventDefault();
        document.body.classList.add("entering-site");
        setTimeout(() => {
          window.location.href = "home.html";
        }, 1200);
      });
      
      </script>
      
    </body>
    
  </html>
